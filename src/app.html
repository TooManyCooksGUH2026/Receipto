<!doctype html>
<html lang="en-GB" data-theme="theme">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#1b1c1e" />
		<meta
			name="description"
			content="Receipto turns your supermarket receipts into a live food price map across the UK."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			try {
				const mode = localStorage.getItem('receipto-mode');
				if (mode === 'dark' || (!mode && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.dataset.mode = 'dark';
				}
			} catch {
				/* ignore */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
